plugins {
    // Релизная версия, а не 1.6-SNAPSHOT: со снапшотом одна и та же ревизия
    // собиралась бы по-разному в зависимости от дня.
    id 'fabric-loom' version '1.6.12'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

// Loom подставляет свои репозитории сам, но полагаться на это не стоит:
// объявлены явно, иначе сборка ломается от смены версии плагина.
repositories {
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Тестируется то, что живёт без Minecraft: разбор vdf, имена файлов, разбор событий CLI.
tasks.named('test') {
    useJUnitPlatform()
    testLogging { events 'failed' }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
