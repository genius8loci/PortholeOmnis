name: modrinth

# Публикация на Modrinth по тому же тегу, что и релиз GitHub.
#
# Workflow намеренно спит, пока его не включат руками: нужны переменная
# MODRINTH_PROJECT_ID (Settings → Variables) и секрет MODRINTH_TOKEN
# (Settings → Secrets). Без них job пропускается, и ничего никуда не уходит.
on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'
  workflow_dispatch:

jobs:
  publish:
    if: vars.MODRINTH_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Та же сверка, что и в release.yml: имя jar берётся из mod_version,
      # и выкладывать под тегом файл с другим номером нельзя.
      - name: Тег должен совпадать с mod_version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^mod_version=[[:space:]]*//p' gradle.properties | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "::error::mod_version не найден в gradle.properties"
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "::error::тег $GITHUB_REF_NAME не совпадает с mod_version=$version в gradle.properties"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # См. build.yml: gradlew приезжает из Windows-репозитория без бита исполнения.
      - run: bash ./gradlew build

      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          # Только сам мод: sources-jar на Modrinth не нужен.
          files: build/libs/!(*-sources).jar
          name: PortholeOmnis ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          loaders: fabric
          game-versions: 1.20.1
          dependencies: fabric-api(required)
