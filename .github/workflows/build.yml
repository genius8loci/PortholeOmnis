name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Через bash, а не ./gradlew: репозиторий заполняется с Windows, где git не хранит
      # бит исполнения, и на раннере файл приезжает без +x.
      - run: bash ./gradlew build

      - uses: actions/upload-artifact@v5
        with:
          name: portholeomnis-dev
          path: build/libs/*.jar
