name: release

# Тег версии собирает мод и вешает jar на релиз GitHub.
# Принимаются оба стиля: v1.0.0 и 1.0.0.
on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Имя jar берётся из mod_version, а не из тега. Без этой сверки тег v1.0.2
      # без правки gradle.properties выложил бы на релиз 1.0.2 файл 1.0.1.
      - name: Тег должен совпадать с mod_version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^mod_version=[[:space:]]*//p' gradle.properties | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "::error::mod_version не найден в gradle.properties"
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "::error::тег $GITHUB_REF_NAME не совпадает с mod_version=$version в gradle.properties"
            exit 1
          fi
          echo "версия $version"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # См. build.yml: gradlew приезжает из Windows-репозитория без бита исполнения.
      - run: bash ./gradlew build

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          # Маска забирает и мод, и sources-jar — оба лежат в build/libs.
          files: build/libs/portholeomnis-*.jar
